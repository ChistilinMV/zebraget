<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZebraGet SuperAdmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --success-hover: #059669;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            color: white;
            width: 100%;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .error-msg { color: var(--danger); margin-top: 0.5rem; }
        .success-msg { color: var(--success); margin-top: 0.5rem; }
    </style>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; align-items: center; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
            <h1 style="font-family: 'Arial Black', sans-serif; font-size: 32px; letter-spacing: -1px; margin-bottom: 2rem;">
                <span style="background: #000; color: #fff; padding: 0 5px; border-radius: 4px 0 0 4px;">Zebra</span><span style="background: #fff; color: #000; border: 3px solid #000; padding: 0 5px; border-radius: 0 4px 4px 0;">Get</span>
            </h1>
            <h2 style="margin-bottom: 1.5rem;">SuperAdmin Login</h2>
            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label>Пароль суперадмина</label>
                    <div style="position: relative;">
                        <input type="password" id="super-password" required placeholder="Введите пароль" style="padding-right: 2.5rem;">
                        <button type="button" onclick="togglePasswordVisibility('super-password', this)" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 0.25rem;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div id="login-error" class="error-msg" style="text-align: center;"></div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Войти</button>
            </form>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <nav class="navbar">
        <h1 style="font-family: 'Arial Black', sans-serif; font-size: 30px; letter-spacing: -1px; margin: 0;">
            <span style="background: #000; color: #fff; padding: 0 5px; border-radius: 4px 0 0 4px;">Zebra</span><span style="background: #fff; color: #000; border: 3px solid #000; padding: 0 5px; border-radius: 0 4px 4px 0;">Get</span>
            <span style="font-family: 'Segoe UI', sans-serif; font-weight: 200; font-size: 20px; color: #000; margin-left: 10px;">/ SuperAdmin</span>
        </h1>
        <button onclick="logout()" style="background:none; border:none; color:var(--danger); font-weight:bold; cursor:pointer; font-size:1rem;">Выйти</button>
    </nav>

    <div class="container">
        
        <div class="card">
            <h2>Сменить пароль Web-Администратора</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Внимание: Изменение этого пароля мгновенно сбросит все активные сессии администраторов. Уволенные сотрудники сразу потеряют доступ.
            </p>
            <form id="adminPasswordForm">
                <div class="form-group">
                    <label>Новый пароль Администратора</label>
                    <div style="position: relative;">
                        <input type="password" id="new-admin-password" required style="padding-right: 2.5rem;">
                        <button type="button" onclick="togglePasswordVisibility('new-admin-password', this)" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 0.25rem;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger">Сбросить сессии и обновить пароль</button>
                <div id="admin-msg"></div>
            </form>
        </div>

        <div class="card">
            <h2>Сменить пароль Суперадминистратора</h2>
            <form id="superPasswordForm">
                <div class="form-group">
                    <label>Новый пароль Суперадмина</label>
                    <div style="position: relative;">
                        <input type="password" id="new-super-password" required style="padding-right: 2.5rem;">
                        <button type="button" onclick="togglePasswordVisibility('new-super-password', this)" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 0.25rem;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Обновить пароль суперадмина</button>
                <div id="super-msg"></div>
            </form>
        </div>

    </div>

    <script>
        function togglePasswordVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btnElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                input.type = 'password';
                btnElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }

        const API = window.location.origin;

        function getAuthHeaders() {
            const token = localStorage.getItem('superToken');
            return {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            };
        }

        window.logout = () => {
            localStorage.removeItem('superToken');
            document.getElementById('login-overlay').style.display = 'flex';
        };

        if (localStorage.getItem('superToken')) {
            document.getElementById('login-overlay').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('super-password').value;
            try {
                const res = await fetch(`${API}/api/superadmin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('superToken', data.token);
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('login-error').innerText = '';
                    document.getElementById('super-password').value = '';
                } else {
                    document.getElementById('login-error').innerText = data.error || 'Ошибка входа';
                }
            } catch (err) {
                document.getElementById('login-error').innerText = 'Ошибка соединения сервера';
            }
        });

        async function handleChangePassword(e, endpoint, inputId, msgId) {
            e.preventDefault();
            const newPassword = document.getElementById(inputId).value;
            const msgEl = document.getElementById(msgId);
            msgEl.className = '';
            msgEl.innerText = 'Загрузка...';

            try {
                const res = await fetch(`${API}/api/superadmin/${endpoint}`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ newPassword })
                });
                const data = await res.json();
                
                if (res.status === 401) {
                    logout();
                    return;
                }

                if (res.ok) {
                    msgEl.className = 'success-msg';
                    msgEl.innerText = 'Пароль успешно изменен!';
                    document.getElementById(inputId).value = '';
                } else {
                    msgEl.className = 'error-msg';
                    msgEl.innerText = data.error || 'Произошла ошибка';
                }
            } catch (err) {
                msgEl.className = 'error-msg';
                msgEl.innerText = 'Ошибка соединения сервера';
            }
        }

        document.getElementById('adminPasswordForm').addEventListener('submit', (e) => {
            handleChangePassword(e, 'change-admin-password', 'new-admin-password', 'admin-msg');
        });

        document.getElementById('superPasswordForm').addEventListener('submit', (e) => {
            handleChangePassword(e, 'change-super-password', 'new-super-password', 'super-msg');
        });

    </script>
</body>
</html>
